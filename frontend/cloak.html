<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IXL | Math, Language Arts, Science, Social Studies, and Spanish</title>
    <meta name="description" content="IXL is the world's most popular subscription-based learning site for K–12. Used by over 18 million students, IXL provides personalized learning in more than 17,000 topics, covering math, language arts, science, social studies, and Spanish. Interactive questions, awards, and certificates keep kids motivated as they master skills.">
    <meta name="keywords" content="School, Science, STEM">
    <meta name="author" content="AxiomEdu">
    <meta property="og:title" content="IXL | Math, Language Arts, Science, Social Studies, and Spanish">
    <meta property="og:description" content="IXL is the world's most popular subscription-based learning site for K–12. Used by over 18 million students, IXL provides personalized learning in more than 17,000 topics, covering math, language arts, science, social studies, and Spanish. Interactive questions, awards, and certificates keep kids motivated as they master skills.">
    <meta property="og:image" content="https://www.ixl.com/dv3/powZqMuTE7du4asFrVyNGxxoqkw/yui3/opengraph/assets/general_us.png">
    <meta property="og:site_name" content="IXL Learning">
    <meta property="og:url" content="https://www.ixl.com/">
    <link rel="icon" href="https://www.ixl.com/ixl-favicon.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="styles/main.css">
    <script src="https://pl28913684.effectivegatecpm.com/01/b1/c3/01b1c3d6225f346f875c89daba0e14a9.js"></script>
</head>

<style>
    .full-wh {
        position: fixed;
        inset: 0;
        z-index: 0;
    }

    .landing-content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        gap: 12px;
    }

    .landing-content h2 {
        font-size: 1.8rem;
        font-weight: 600;
        margin: 0 0 4px;
        letter-spacing: 0.5px;
    }

    .landing-content p {
        margin: 0 0 16px;
        opacity: 0.7;
        font-size: 0.95rem;
    }

    #options {
        display: flex;
        gap: 12px;
        flex-direction: row;
        justify-content: center;
    }

    #options div {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        border: 1px solid var(--theme-border);
        padding: 14px 18px;
        border-radius: 12px;
        transition: background 0.2s, border-color 0.2s, transform 0.15s;
        font-size: 0.85rem;
        color: #fff;
    }

    #options div:hover {
        transform: translateY(-2px);
    }

    #options div .material-symbols-outlined {
        font-size: 28px;
    }
</style>

<body>
    <div class="full-wh">
        <div class="bg-animation">
            <div id='stars'></div>
            <div id='stars2'></div>
        </div>
    </div>

    <div class="landing-content">
        <h2>Welcome to Axiom!</h2>
        <p>Use one of the following to make the link last longer!</p>
        <div id="options">
            <div id="window">
                <span class="material-symbols-outlined">tab</span>
                <span>Window A:B</span>
            </div>
            <div id="file">
                <span class="material-symbols-outlined">file_copy</span>
                <span>File Cloak</span>
            </div>
            <div id="blob">
                <span class="material-symbols-outlined">link</span>
                <span>Blob Cloak</span>
            </div>
            <div onclick="cloak()">
                <span class="material-symbols-outlined">language</span>
                <span>A:B Cloak</span>
            </div>
        </div>
    </div>


<script src="./browser/scripts/themes.js"></script>
<script>

    function cloak() {
        tab = window.open("about:blank", target="_blank")
        tab.document.write(`
      <html>
      <head>
        <title>Google</title>
        <link rel="icon" href="${window.location.origin}/os/google_favicon.ico" type="image/x-icon">
      </head>
      <body>
        <iframe src="index.html" style="border:none; height: 100%; width: 100%; position: fixed; left: 0px; top: 0px;">
      </body>

`)
        tab.document.close()
    }

    
    // check for mobile
    if (navigator.userAgent.match(/Android/i) ||
        navigator.userAgent.match(/webOS/i) ||
        navigator.userAgent.match(/iPhone/i) ||
        navigator.userAgent.match(/iPad/i) ||
        navigator.userAgent.match(/iPod/i) ||
        navigator.userAgent.match(/BlackBerry/i) ||
        navigator.userAgent.match(/Windows Phone/i)) {
        window.location.href = "mobile.html"
    }

    let windowab = document.getElementById("window")
    windowab.addEventListener("click", () => {
        const windowFeatures = 'width=1200,height=1200,resizable=yes,scrollbars=yes,status=yes';
        const newWindow = window.open(window.location.origin + '/index.html', 'Google', windowFeatures);
        
        setTimeout(() => {
            if (newWindow) {
                try {
                    newWindow.document.title = "Google";
                    const link = newWindow.document.createElement('link');
                    link.rel = 'icon';
                    link.href = window.location.origin + '/os/google_favicon.ico';
                    newWindow.document.head.appendChild(link);
                } catch (e) {
                    console.log("Could not modify window properties due to cross-origin restrictions");
                }
            }
        }, 100);
    })
    
    let file = document.getElementById("file")
    file.addEventListener("click", () => {
        const htmlContent = `
            <html>
            <head>
                <title>Google</title>
                <link rel="icon" href="${window.location.origin}/os/google_favicon.ico" type="image/x-icon">
            </head>
            <body>
                <iframe src="${window.location.origin}/index.html" style="border:none; height: 100%; width: 100%; position: fixed; left: 0px; top: 0px;"></iframe>
            </body>
            </html>

        `;
        const object_URL = URL.createObjectURL(new Blob([htmlContent], { type: 'text/html' }));

        const a = document.createElement('a');
        a.href = object_URL;
        a.download = "axiom_launcher_" + window.location.origin + ".html"; 

        document.body.appendChild(a);
        a.click();
    })

    let blob = document.getElementById("blob")
    blob.addEventListener("click", () => {
        const htmlContent = `
            <html>
            <head>
                <title>Google</title>
                <link rel="icon" href="${window.location.origin}/os/google_favicon.ico" type="image/x-icon">
            </head>
            <body>
                <iframe src="${window.location.origin}/index.html" style="border:none; height: 100%; width: 100%; position: fixed; left: 0px; top: 0px;"></iframe>
            </body>
            </html>

        `;
        const object_URL = URL.createObjectURL(new Blob([htmlContent], { type: 'text/html' }));

        window.open(object_URL, '_blank');
    })
</script>
</body>
</html>
