<!DOCTYPE html>
<html lang="en">

<head>
    <script src="./scripts/font-scramble.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axiom</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./fonts/fonts.css">
    <script src="./scripts/theme.js"></script>
    <script src="./scripts/premium.js"></script>
    <link href="./styles/loader.css" rel="stylesheet">
    <link href="./styles/start.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@13/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <link href="./styles/chat.css" rel="stylesheet">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EP8214CHBW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-EP8214CHBW');
    </script>
</head>

<body>

    <div id="axiom-loader" class="ao-loader">
        <div class="ao-loader-logo">Axiom</div>
        <div class="ao-loader-spinner"></div>
    </div>

    <!-- Conversation sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
            <button class="icon-btn" id="new-chat-btn" title="New chat">
                <span class="material-symbols-outlined">add_comment</span>
            </button>
            <button class="icon-btn" id="collapse-btn" title="Hide sidebar">
                <span class="material-symbols-outlined">left_panel_close</span>
            </button>
        </div>
        <div class="sidebar-search">
            <span class="material-symbols-outlined">search</span>
            <input id="convo-search" type="text" placeholder="Search chats" autocomplete="off">
        </div>
        <div class="convo-list" id="convo-list"></div>
        <div class="sidebar-foot">
            <button class="text-btn" id="clear-all-btn">
                <span class="material-symbols-outlined">delete_sweep</span> Clear all chats
            </button>
        </div>
    </aside>

    <button class="icon-btn sidebar-open" id="open-btn" title="Show sidebar">
        <span class="material-symbols-outlined">left_panel_open</span>
    </button>
    <div class="sidebar-scrim" id="sidebar-scrim"></div>

    <div class="dropdown" id="modelDropdown">
        <div class="dropdown-trigger" id="dropdownTrigger">
            <span id="dropdownLabel">Loading models…</span>
            <span class="material-symbols-outlined dropdown-chevron">expand_more</span>
        </div>
        <div class="dropdown-panel" id="dropdownPanel">
        </div>
    </div>

    <main class="chat-main" id="chat-main">
        <div class="messages"></div>

        <div class="empty-state" id="empty-state">
            <h1 class="empty-logo">Axiom AI</h1>
            <p class="empty-sub">Intelligent assistance powered by our own models (https://huggingface.co/LucidityAI)</p>
            <div class="suggestions" id="suggestions">
                <button class="suggestion" data-prompt="Explain this step by step so I actually understand it: ">Explain a concept</button>
                <button class="suggestion" data-prompt="Check my work and point out any mistakes: ">Check my work</button>
                <button class="suggestion" data-prompt="Summarize the key points of this: ">Summarize notes</button>
                <button class="suggestion" data-prompt="Quiz me on this topic, one question at a time: ">Quiz me</button>
            </div>
        </div>

        <div id="image-previews"></div>
        <div id="attach-menu">
            <div class="attach-option" onclick="triggerFileUpload()">
                <span class="material-symbols-outlined attach-option-icon">upload</span> Upload image
            </div>
            <div class="attach-option" onclick="captureTab()">
                <span class="material-symbols-outlined attach-option-icon">screenshot_monitor</span> Capture tab / screen
            </div>
        </div>
        <input type="file" id="file-input" class="file-input" accept="image/*" multiple>

        <div class="chat-composer">
            <button onclick="toggleAttachMenu()" title="Attach image">
                <span class="material-symbols-outlined" id="attach-icon">add</span>
            </button>
            <span class="rainbow-input">
                <textarea placeholder="Send a message" class="search-bar" rows="1"></textarea>
            </span>
            <button id="send-btn" title="Send">
                <span class="material-symbols-outlined">send</span>
            </button>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <script src="./scripts/loader.js"></script>
    <script src="./scripts/chat.js"></script>
</body>
</html>
