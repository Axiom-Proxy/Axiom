<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axiom Network</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="styles/main.css">
    <script src="./os/winbox.bundle.min.js"></script>
</head>

<body>



    <div class="full-wh">
        <div class="bg-animation">
            <div id='stars'></div>
            <div id='stars2'></div>
        </div>
    </div>


    <div id="loader">
        <h2 class="loader-text">Axiom</h2>
        <div class="loader"></div>
    </div>

    <div id="desktop">
        <!-- yes the clas name is wrong, deal with it -->
        <h2 class="logo" id="time"></h2>
    </div>
    
    <div id="contextMenu" class="context-menu">
        <div class="context-menu-item" data-app="browser">
            <span class="material-symbols-outlined">language</span>
            <span>Browser</span>
        </div>
        <div class="context-menu-item" data-app="games">
            <span class="material-symbols-outlined">gamepad</span>
            <span>Games</span>
        </div>
        <div class="context-menu-item" data-app="ai" style="display: none;">
            <span class="material-symbols-outlined">article</span>
            <span>AI Chat</span>
        </div>
        <div class="context-menu-item" data-app="settings">
            <span class="material-symbols-outlined">settings</span>
            <span>Settings</span>
        </div>
    </div>

    <div class="startmenu" id="info">
        <img src="./browser/assets/axiom.png" style="width: 30px">
    </div>

    <div class="battery">
        <span class="material-symbols-outlined" id="battery-icon">battery_full</span>
    </div>


    <div id="taskbar">
        <span class="material-symbols-outlined start-btn" id="browser">language</span>
        <span class="material-symbols-outlined start-btn" id="games">gamepad</span>
        <span class="material-symbols-outlined start-btn" id="ai" style="display: none;">article</span>
         <span class="material-symbols-outlined start-btn" id="terminal">terminal</span>
        <span class="material-symbols-outlined start-btn" id="settings">settings</span>
    </div>
    <script src="./browser/scripts/premium.js"></script>
    <script src="./browser/scripts/themes.js"></script>
    <script src="./scripts/os/osEssensials.js"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EP8214CHBW"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-EP8214CHBW');
    </script>
    <script>

        window.addEventListener('load', () => {
            sessionStorage.setItem('isMainPage', 'true');
        });
        window.addEventListener('unload', () => {
            sessionStorage.removeItem('isMainPage');
        });

        function updateBattery(battery) {
            const icon = document.getElementById('battery-icon');
            const level = battery.level;
            const charging = battery.charging;
            let name;
            if (charging) {
                if (level >= 0.9) name = 'battery_charging_full';
                else if (level >= 0.7) name = 'battery_charging_80';
                else if (level >= 0.5) name = 'battery_charging_60';
                else if (level >= 0.3) name = 'battery_charging_50';
                else if (level >= 0.1) name = 'battery_charging_20';
                else name = 'battery_charging_20';
            } else {
                if (level >= 0.95) name = 'battery_full';
                else if (level >= 0.8) name = 'battery_5_bar';
                else if (level >= 0.65) name = 'battery_4_bar';
                else if (level >= 0.5) name = 'battery_3_bar';
                else if (level >= 0.3) name = 'battery_2_bar';
                else if (level >= 0.1) name = 'battery_1_bar';
                else name = 'battery_0_bar';
            }
            icon.textContent = name;
            icon.title = `${Math.round(level * 100)}%${charging ? ' (charging)' : ''}`;
        }

        if (navigator.getBattery) {
            navigator.getBattery().then(battery => {
                updateBattery(battery);
                battery.addEventListener('levelchange', () => updateBattery(battery));
                battery.addEventListener('chargingchange', () => updateBattery(battery));
            });
        } else {
            document.getElementById('battery-icon').textContent = 'battery_unknown';
        }

        setInterval(() => {
            // get h;m
            let time = new Date();
            let hour = time.getHours();
            let minute = time.getMinutes();
            let ampm = hour >= 12 ? 'PM' : 'AM';
            hour = hour % 12;
            hour = hour ? hour : 12; // the hour '0' should be '12'
            minute = minute < 10 ? '0' + minute : minute;
            let strTime = hour + ':' + minute + ' ' + ampm;
            document.getElementById('time').innerHTML = strTime;
        }, 100);
    </script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-EP8214CHBW"></script>

</html>
