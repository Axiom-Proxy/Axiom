<!DOCTYPE html>
<html lang="en">
<head>
    <script src="./scripts/font-scramble.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Desktop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="./fonts/fonts.css">
    <link href="./styles/loader.css" rel="stylesheet">
    <link href="./styles/main.css" rel="stylesheet">
    <link href="./styles/remote-desktop.css" rel="stylesheet">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EP8214CHBW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-EP8214CHBW');
    </script>
</head>
<body>
    <div id="axiom-loader" class="ao-loader">
        <div class="ao-loader-logo">Axiom</div>
        <div class="ao-loader-spinner"></div>
    </div>
    <main class="remote-desktop" id="remoteDesktop">
        <form class="remote-desktop__form" id="connectionForm">
            <h1>Remote Desktop</h1>
            <label>Server<span class="remote-desktop__field"><input name="host" autocomplete="url" required></span></label>
            <label>Port<span class="remote-desktop__field"><input name="port" type="number" min="1" max="65535" value="3389" required></span></label>
            <label>Domain<span class="remote-desktop__field"><input name="domain" autocomplete="organization"></span></label>
            <label>Username<span class="remote-desktop__field"><input name="username" autocomplete="username"></span></label>
            <label>Access token<span class="remote-desktop__field"><input name="accessToken" type="password" autocomplete="current-password" required></span></label>
            <p class="remote-desktop__status" id="connectionStatus" aria-live="polite"></p>
            <button type="submit">Connect</button>
        </form>
    </main>
    <script src="./scripts/loader.js"></script>
    <script type="module" src="./scripts/remote-desktop.js"></script>
</body>
</html>
