<!DOCTYPE html>
<html>
	<head>
		<title>Axiom Terminal V3</title>
		<style>
			@import url('https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&display=swap');

body {
    color: #fff;	
    font-family: "Google Sans Code";
}

@keyframes blink {
    0% {
        opacity: 1;
    }
    50% {
       opacity: 0; 
    }
    100% {
        opacity: 1;
    }
}

#cursor {
    background-color: white;
    width: min-content;
    display: inline;
    height: min-content;
    animation: blink 1s steps(1) infinite;
}

#typing-sector {
    display: inline;
}
</style>
	</head>
	<body>
		Welcome to the Axiom Terminal! You can use javascript here.
		<br>
		><div id="typing-sector"></div><div id="cursor">f</div>
	</body>
	<script>
		let text = ""

console.log = function(input){
    document.getElementById("typing-sector").innerHTMl+="<br>" + input
}
console.warn = function(input) { console.log("[WARN]: " + input) }
console.error = function(input) { console.log("[ERR]: " + input) }

function handleCommand(text){
    eval(text)
}

document.addEventListener("keydown", function(event){
    if (event.key == "Backspace"){
        text = text.slice(0, text.length - 1)
        document.getElementById("typing-sector").innerText = (document.getElementById("typing-sector").innerText).slice(0, (document.getElementById("typing-sector").innerText).length-1)
        return
    }
    if (event.key == "Enter"){
        handleCommand(text)
        text = ""
        document.getElementById("typing-sector").innerHTML += "<br>>"
        return
    }
    if (event.key == "Shift") return
    text += event.key
    document.getElementById("typing-sector").innerText += event.key
})
	</script>
</html>
