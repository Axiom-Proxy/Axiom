<!DOCTYPE html>
<html lang="en">

<head>
    <script>
    (function(){
        // Educational page cloaking: first visit in a tab session shows a random
        // educational page. Refresh the tab to reveal the real content.
        var KEY = '__ax_edu';
        if (!sessionStorage.getItem(KEY)) {
            sessionStorage.setItem(KEY, '1');
            // Pool of educational pages — add more entries to expand the rotation.
            var pages = [
                '/edu_pages/math.html',
                '/edu_pages/science.html',
                '/edu_pages/history.html',
                '/edu_pages/programming.html',
                '/edu_pages/economics.html',
                '/edu_pages/english.html',
                '/edu_pages/art.html'
            ];
            var page = pages[Math.floor(Math.random() * pages.length)];
            try {
                var x = new XMLHttpRequest();
                x.open('GET', page, false);
                x.send();
                if (x.status === 200) {
                    document.open();
                    document.write(x.responseText);
                    document.close();
                    // Abort the original document's parser so leftover scripts
                    // (Discord modal, loader, landing, ad) never fire on the edu page.
                    window.stop();
                }
            } catch(e) { /* Silently fall through to real page */ }
        }
    })();
    </script>
    <script src="./scripts/font-scramble.js"></script>

</head>

<body>

    <div id="axiom-loader" class="ao-loader">
        <div class="ao-loader-logo">Axiom</div>
        <div class="ao-loader-spinner"></div>
    </div>

    <div class="corner corner-brand glass" aria-hidden="true">
        <svg viewBox="0 0 24 22">
            <path d="M12 1.8 22.6 20.2H1.4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <path d="M12 8 17.4 17.6H6.6Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M12 12.6 14.1 16.2H9.9Z" fill="currentColor"/>
        </svg>
        <span>Axiom</span>
    </div>
    <div class="corner corner-clock glass" aria-hidden="true">
        <span class="cc-date" id="cc-date"></span>
        <span class="cc-time" id="cc-time"></span>
    </div>

    <main class="landing">
        <section class="panel glass" aria-labelledby="landing-title">
            <header class="hero">
                <div class="hero-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 22">
                        <path d="M12 1.8 22.6 20.2H1.4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                        <path d="M12 8 17.4 17.6H6.6Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                        <path d="M12 12.6 14.1 16.2H9.9Z" fill="currentColor"/>
                    </svg>
                </div>
                <h1 id="landing-title">Welcome to <span class="speciale">Axiom</span></h1>
                <p>Pick a mode, then choose how to open it.</p>
            </header>

            <div class="step" id="step-mode"><span class="step-num">1</span>Mode</div>
            <div class="mode-row" role="radiogroup" aria-labelledby="step-mode">
                <button class="tile mode-card" type="button" role="radio" aria-checked="true" data-mode="simple" onclick="selectMode('simple')">
                    <span class="mode-preview" aria-hidden="true">
                        <svg viewBox="0 0 120 72">
                            <rect class="pv" x="4" y="4" width="112" height="9" rx="3"/>
                            <rect class="pv-accent" x="18" y="5.5" width="22" height="6" rx="2"/>
                            <rect class="pv-dim" x="43" y="5.5" width="22" height="6" rx="2"/>
                            <rect class="pv" x="4" y="16" width="11" height="52" rx="3"/>
                            <rect class="pv-dim" x="18" y="16" width="98" height="52" rx="4"/>
                        </svg>
                    </span>
                    <span class="tile-name">Simple</span>
                    <span class="tile-hint">Tabs and a sidebar</span>
                    <span class="mode-check" aria-hidden="true"><span class="material-symbols-outlined">check</span></span>
                </button>
                <button class="tile mode-card" type="button" role="radio" aria-checked="false" data-mode="windows" onclick="selectMode('windows')">
                    <span class="mode-preview" aria-hidden="true">
                        <svg viewBox="0 0 120 72">
                            <rect class="pv" x="0" y="0" width="120" height="5"/>
                            <rect class="pv-dim" x="14" y="12" width="56" height="36" rx="3"/>
                            <rect class="pv" x="40" y="20" width="62" height="36" rx="3"/>
                            <rect class="pv-accent" x="40" y="20" width="62" height="6" rx="3"/>
                            <rect class="pv" x="34" y="61" width="52" height="8" rx="3"/>
                        </svg>
                    </span>
                    <span class="tile-name">Windows</span>
                    <span class="tile-hint">A full desktop</span>
                    <span class="mode-check" aria-hidden="true"><span class="material-symbols-outlined">check</span></span>
                </button>
                <button class="tile mode-card" type="button" role="radio" aria-checked="false" data-mode="remote-desktop" onclick="selectMode('remote-desktop')">
                    <span class="mode-preview" aria-hidden="true">
                        <svg viewBox="0 0 120 72">
                            <rect class="pv" x="26" y="8" width="68" height="44" rx="4"/>
                            <rect class="pv-dim" x="30" y="12" width="60" height="36" rx="2"/>
                            <path class="pv-line" d="M52 60h16M60 52v8"/>
                            <path class="pv-accent" d="M56 22l12 8-5.5 1.2L66 37l-2.6 1.3-3.4-5.8L56 36Z"/>
                        </svg>
                    </span>
                    <span class="tile-name">Remote Desktop</span>
                    <span class="tile-hint">Stream a real computer</span>
                    <span class="mode-check" aria-hidden="true"><span class="material-symbols-outlined">check</span></span>
                </button>
            </div>

            <div class="step"><span class="step-num">2</span>Open with</div>
            <div class="cloak-row">
                <button class="tile cloak-card" type="button" onclick="openWindowAB()">
                    <span class="material-symbols-outlined" aria-hidden="true">tab</span>
                    <span class="tile-name">Window A:B</span>
                    <span class="tile-hint">Pop-up</span>
                </button>
                <button class="tile cloak-card" type="button" onclick="openFileCloak()">
                    <span class="material-symbols-outlined" aria-hidden="true">file_copy</span>
                    <span class="tile-name">File Cloak</span>
                    <span class="tile-hint">HTML file</span>
                </button>
                <button class="tile cloak-card" type="button" onclick="openBlobCloak()">
                    <span class="material-symbols-outlined" aria-hidden="true">link</span>
                    <span class="tile-name">Blob Cloak</span>
                    <span class="tile-hint">blob: tab</span>
                </button>
                <button class="tile cloak-card" type="button" onclick="openABCloak()">
                    <span class="material-symbols-outlined" aria-hidden="true">language</span>
                    <span class="tile-name">A:B Cloak</span>
                    <span class="tile-hint">about:blank</span>
                </button>
                <button class="tile cloak-card" type="button" onclick="openB64Cloak()">
                    <span class="material-symbols-outlined" aria-hidden="true">encrypted</span>
                    <span class="tile-name">B64 Cloak</span>
                    <span class="tile-hint">data: URL</span>
                </button>
            </div>
        </section>

        <footer class="landing-foot">
            <button class="foot-link" type="button" onclick="openDiscordModal()">
                <span class="material-symbols-outlined" aria-hidden="true">forum</span>
                Discord
            </button>
        </footer>
    </main>

    <div class="modal-overlay" id="discord-modal">
        <div class="modal-card glass" role="dialog" aria-modal="true" aria-labelledby="discord-title">
            <button class="modal-close" type="button" onclick="closeDiscordModal()" aria-label="Close">
                <span class="material-symbols-outlined" aria-hidden="true">close</span>
            </button>
            <div class="modal-icon" aria-hidden="true"><span class="material-symbols-outlined">forum</span></div>
            <h3 id="discord-title">Join our Discord!</h3>
            <p>For more links, updates, and support, join our Discord server:</p>
            <a class="modal-link" href="https://discord.gg/pnGGmHqjGj" target="_blank" rel="noopener">https://discord.gg/pnGGmHqjGj</a>
            <button class="modal-ok" type="button" onclick="closeDiscordModal()">Okay</button>
        </div>
    </div>

    <script>
        function openDiscordModal() {
            document.getElementById('discord-modal').classList.add('open');
        }
        function closeDiscordModal() {
            document.getElementById('discord-modal').classList.remove('open');
        }
        window.addEventListener('load', () => {
            const modal = document.getElementById('discord-modal');
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeDiscordModal();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeDiscordModal();
            });
            openDiscordModal();
        });
    </script>

    <script src="./scripts/loader.js"></script>
    <script src="./scripts/landing.js"></script>
    <script src="./scripts/ad.js"></script>
    <script>
        alert("refresh the page")
    </script>
</body>
