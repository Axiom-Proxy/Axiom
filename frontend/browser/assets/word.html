<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GApps Iframe Tester - Single View</title>
  <style>
    :root {
      --bg: #0f0f12;
      --card: #1a1a20;
      --text: #e0e0ff;
      --muted: #a0a0c0;
      --success: #4ade80;
      --danger: #f87171;
      --primary: #6366f1;
      --border: #2a2a35;
      --progress: #2a2a35;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      line-height: 1.5;
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    h1 { font-size: 1.4rem; font-weight: 600; }
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: opacity 0.2s, transform 0.1s;
      font-size: 0.9rem;
    }
    button:hover { opacity: 0.9; }
    button:active { transform: translateY(1px); }
    button.danger { background: var(--danger); }
    button.success { background: var(--success); color: #0f172a; }
    button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    
    .progress-bar {
      height: 6px;
      background: var(--progress);
      border-radius: 3px;
      margin: 16px 0 20px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }
    
    .status-bar {
      background: var(--card);
      padding: 10px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .card-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .card-img {
      width: 56px;
      height: 56px;
      border-radius: 10px;
      object-fit: cover;
      background: #2a2a35;
      flex-shrink: 0;
      border: 1px solid var(--border);
    }
    .card-info {
      flex: 1;
      min-width: 200px;
    }
    .card-title {
      font-weight: 600;
      font-size: 1.15rem;
      margin-bottom: 4px;
    }
    .card-meta {
      font-size: 0.85rem;
      color: var(--muted);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .card-type {
      font-size: 0.75rem;
      color: var(--primary);
      background: rgba(99, 102, 241, 0.15);
      padding: 2px 10px;
      border-radius: 999px;
    }
    
    .iframe-wrapper {
      position: relative;
      width: 100%;
      height: 400px; /* Taller for better game visibility */
      background: #0a0a0d;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .iframe-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: white;
      display: block;
    }
    .iframe-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      text-align: center;
      padding: 20px;
      background: linear-gradient(135deg, #0a0a0d 0%, #121218 100%);
    }
    .iframe-placeholder svg {
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
      opacity: 0.6;
    }
    
    .card-actions {
      padding: 16px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      border-top: 1px solid var(--border);
    }
    
    .nav-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      padding: 16px;
      border-top: 1px solid var(--border);
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      background: var(--card);
      border-radius: 12px;
      border: 1px dashed var(--border);
    }
    .empty-state h3 {
      color: var(--text);
      margin: 12px 0 8px;
      font-size: 1.2rem;
    }
    
    .warning {
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.3);
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: 8px;
      margin: 16px 0;
      font-size: 0.85rem;
      line-height: 1.4;
    }
    
    .url-preview {
      font-family: monospace;
      font-size: 0.75rem;
      color: var(--muted);
      word-break: break-all;
      margin-top: 6px;
      max-height: 2.4em;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    
    @media (max-width: 600px) {
      .iframe-wrapper { height: 300px; }
      .card-header { flex-direction: column; text-align: center; }
      .card-actions, .nav-actions { flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🎮 GApps Tester <span style="font-weight:400;color:var(--muted)">• Single View</span></h1>
    <div class="controls">
      <button id="reloadBtn" title="Reload apps from gapps.json">↻ Reload</button>
      <button id="downloadBtn" disabled>💾 Download Updated JSON</button>
      <button id="clearStorageBtn" class="ghost" title="Clear saved removals">🗑️ Clear Cache</button>
    </div>
  </header>

  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

  <div class="status-bar">
    <span id="statusText">Loading apps...</span>
    <span id="countBadge">0/0</span>
  </div>

  <div class="warning">
    ⚠️ Many sites block iframing via <code>X-Frame-Options</code> or CSP. 
    If you see "refused to connect", the site likely blocks embedding — mark it as <strong>Not Working</strong>.
  </div>

  <div id="appContainer">
    <!-- Single app card renders here -->
  </div>

  <script>
    // Configuration
    const JSON_URL = 'gapps.json';
    const IFRAME_HEIGHT = 400;
    
    // State
    let apps = [];
    let currentIndex = 0;
    let removedAppUrls = new Set(JSON.parse(localStorage.getItem('gapps_removed') || '[]'));
    
    // DOM Elements
    const container = document.getElementById('appContainer');
    const statusText = document.getElementById('statusText');
    const countBadge = document.getElementById('countBadge');
    const progressFill = document.getElementById('progressFill');
    const downloadBtn = document.getElementById('downloadBtn');
    const reloadBtn = document.getElementById('reloadBtn');
    const clearStorageBtn = document.getElementById('clearStorageBtn');
    
    // Initialize
    async function init() {
      updateUI('Loading apps...', 0, 0);
      container.innerHTML = '<div class="empty-state">🔄 Fetching gapps.json...</div>';
      
      try {
        const res = await fetch(JSON_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        apps = await res.json();
        
        // Filter out already-removed apps
        apps = apps.filter(app => !removedAppUrls.has(app.app_url.trim()));
        
        if (apps.length === 0) {
          showEmptyState();
          return;
        }
        
        currentIndex = 0;
        renderCurrentApp();
      } catch (err) {
        console.error('Failed to load gapps.json:', err);
        container.innerHTML = `
          <div class="empty-state">
            <h3>❌ Failed to load apps</h3>
            <p style="margin-bottom:12px">${escapeHtml(err.message)}</p>
            <p style="font-size:0.85rem;color:var(--muted)">
              Make sure:<br>
              • gapps.json exists in the same folder<br>
              • You're serving via HTTP(S), not file://<br>
              • CORS is configured if loading remotely
            </p>
          </div>
        `;
        updateUI(`Error: ${err.message}`, 0, 0);
      }
    }
    
    function showEmptyState() {
      container.innerHTML = `
        <div class="empty-state">
          <h3>🎉 All Done!</h3>
          <p>No more apps to test.</p>
          <p style="margin:16px 0 8px;font-size:0.9rem">
            ${removedAppUrls.size} app${removedAppUrls.size!==1?'s':''} marked as not working
          </p>
          <button id="finishDownloadBtn" class="success" style="margin-top:8px">
            💾 Download Final JSON
          </button>
        </div>
      `;
      document.getElementById('finishDownloadBtn')?.addEventListener('click', downloadUpdatedJson);
      updateUI('Testing complete!', apps.length, apps.length);
      downloadBtn.disabled = true;
    }
    
    function renderCurrentApp() {
      if (currentIndex >= apps.length) {
        showEmptyState();
        return;
      }
      
      const app = apps[currentIndex];
      const cleanUrl = app.app_url.trim();
      const total = apps.length;
      const position = currentIndex + 1;
      
      // Update progress
      updateUI(`Testing app ${position} of ${total}`, position, total);
      progressFill.style.width = `${(position / total) * 100}%`;
      
      // Build card
      container.innerHTML = `
        <div class="card">
          <div class="card-header">
            <img class="card-img" 
                 src="${app.app_img || generatePlaceholderSvg()}" 
                 alt="${escapeHtml(app.app_name)}"
                 onerror="this.src='${generatePlaceholderSvg()}'">
            <div class="card-info">
              <div class="card-title">${escapeHtml(app.app_name)}</div>
              <div class="card-meta">
                <span class="card-type">${escapeHtml(app.type || 'app')}</span>
                <span>•</span>
                <span>${position}/${total}</span>
              </div>
              <div class="url-preview" title="${escapeHtml(cleanUrl)}">
                ${escapeHtml(cleanUrl)}
              </div>
            </div>
          </div>
          
          <div class="iframe-wrapper">
            <div class="iframe-placeholder" id="iframePlaceholder">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="2" y="3" width="20" height="14" rx="2"/>
                <path d="M8 21h8M12 17v4"/>
              </svg>
              <div style="font-weight:500;margin-bottom:6px">Iframe will load below</div>
              <div style="font-size:0.8rem;max-width:300px">
                Click "Load Iframe" to test this app. 
                Only one iframe loads at a time to save memory.
              </div>
            </div>
            <iframe 
              id="testIframe"
              src=""
              title="${escapeHtml(app.app_name)}"
              loading="lazy"
              style="display:none"
            ></iframe>
          </div>
          
          <div class="card-actions">
            <button id="loadIframeBtn" class="ghost">▶️ Load Iframe</button>
            <button id="workingBtn" class="success" disabled>✓ Working</button>
            <button id="notWorkingBtn" class="danger" disabled>✗ Not Working</button>
          </div>
          
          <div class="nav-actions">
            <button id="prevBtn" class="ghost" ${currentIndex === 0 ? 'disabled' : ''}>← Previous</button>
            <button id="skipBtn" class="ghost">⏭️ Skip (Keep for Later)</button>
            <button id="nextBtn" class="ghost" ${currentIndex >= apps.length - 1 ? 'disabled' : ''}>Next →</button>
          </div>
        </div>
      `;
      
      // Attach event listeners
      document.getElementById('loadIframeBtn').addEventListener('click', () => loadIframe(cleanUrl));
      document.getElementById('workingBtn').addEventListener('click', () => markAsTested(false));
      document.getElementById('notWorkingBtn').addEventListener('click', () => markAsTested(true));
      document.getElementById('prevBtn').addEventListener('click', () => navigate(-1));
      document.getElementById('nextBtn').addEventListener('click', () => navigate(1));
      document.getElementById('skipBtn').addEventListener('click', () => navigate(1)); // Skip = keep, move on
    }
    
    function loadIframe(url) {
      const iframe = document.getElementById('testIframe');
      const placeholder = document.getElementById('iframePlaceholder');
      const loadBtn = document.getElementById('loadIframeBtn');
      const workingBtn = document.getElementById('workingBtn');
      const notWorkingBtn = document.getElementById('notWorkingBtn');
      
      // Show loading state
      placeholder.innerHTML = `
        <div style="display:flex;flex-direction:column;align-items:center;gap:12px">
          <div style="width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite"></div>
          <div>Loading iframe...</div>
          <div style="font-size:0.75rem;color:var(--muted);max-width:280px;text-align:center">
            If it hangs or shows an error, the site likely blocks embedding
          </div>
        </div>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      `;
      
      // Enable action buttons after short delay (let iframe start loading)
      setTimeout(() => {
        workingBtn.disabled = false;
        notWorkingBtn.disabled = false;
        loadBtn.disabled = true;
        loadBtn.textContent = '✓ Iframe Loaded';
      }, 800);
      
      // Actually load the iframe
      iframe.src = url;
      iframe.style.display = 'block';
      placeholder.style.display = 'none';
      
      // Optional: detect load/error (limited by cross-origin)
      iframe.onload = () => {
        console.log('Iframe loaded (or at least started):', url);
      };
      iframe.onerror = () => {
        console.warn('Iframe error (likely cross-origin block):', url);
      };
    }
    
    function markAsTested(remove) {
      const app = apps[currentIndex];
      const cleanUrl = app.app_url.trim();
      
      if (remove) {
        removedAppUrls.add(cleanUrl);
        localStorage.setItem('gapps_removed', JSON.stringify([...removedAppUrls]));
      }
      
      // Visual feedback
      const card = container.querySelector('.card');
      card.style.opacity = '0.7';
      card.style.pointerEvents = 'none';
      
      // Move to next after brief delay
      setTimeout(() => {
        currentIndex++;
        renderCurrentApp();
      }, 250);
    }
    
    function navigate(direction) {
      const newIndex = currentIndex + direction;
      if (newIndex < 0 || newIndex > apps.length) return;
      
      // If moving forward from last tested, just proceed
      currentIndex = newIndex;
      renderCurrentApp();
    }
    
    function updateUI(message, current, total) {
      statusText.textContent = message;
      countBadge.textContent = total > 0 ? `${current}/${total}` : '0/0';
      downloadBtn.disabled = total === 0;
    }
    
    function downloadUpdatedJson() {
      const updated = apps.filter(app => !removedAppUrls.has(app.app_url.trim()));
      const blob = new Blob([JSON.stringify(updated, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'gapps_updated.json';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 0);
    }
    
    function clearStorage() {
      if (confirm('Clear all saved "Not Working" markings? This won\'t affect the original gapps.json file.')) {
        localStorage.removeItem('gapps_removed');
        removedAppUrls.clear();
        // Re-fetch to include previously removed apps
        init();
      }
    }
    
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[c]);
    }
    
    function generatePlaceholderSvg() {
      // Inline SVG as data URL for fallback images
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 12h8M12 8v8"/></svg>`;
      return `data:image/svg+xml,${encodeURIComponent(svg)}`;
    }
    
    // Event Listeners
    downloadBtn.addEventListener('click', downloadUpdatedJson);
    reloadBtn.addEventListener('click', init);
    clearStorageBtn.addEventListener('click', clearStorage);
    
    // Start
    init();
  </script>
</body>
</html>
