<body>
    <main class="game-page">
        <section class="game-panel">
            <div class="game-stage">
                <iframe id="game-frame" title="Game" allow="fullscreen; autoplay; clipboard-read; clipboard-write"></iframe>
            </div>
            <nav class="game-controls" aria-label="Game controls">
                <button type="button" data-action="back" title="Back to games"><span class="material-symbols-outlined">arrow_back</span></button>
                <button type="button" data-action="fullscreen" title="Fullscreen"><span class="material-symbols-outlined">fullscreen</span></button>
                <button type="button" data-action="reload" title="Reload"><span class="material-symbols-outlined">refresh</span></button>
                <button type="button" data-action="share" title="Copy link"><span class="material-symbols-outlined">share</span></button>
                <button type="button" data-action="open" title="Open game"><span class="material-symbols-outlined">open_in_new</span></button>
            </nav>
        </section>

        <aside class="ad-panel" aria-label="Advertisement">
            <span class="ad-label">Advertisement</span>
            <div id="ad-frame-wrap" class="ad-frame-wrap"></div>
            <script>
                /*
                 * The ad network's banner script is wrapped in a sandboxed iframe so
                 * its creatives can never redirect/navigate this page (frame-busting).
                 * "allow-scripts" lets the banner render; "allow-popups" keeps legit
                 * click-through behavior. Deliberately NO "allow-top-navigation" and
                 * NO "allow-same-origin": top-window redirects and parent access are
                 * blocked by the browser itself.
                 */
                (function () {
                    var wrap = document.getElementById("ad-frame-wrap");
                    var adFrame = document.createElement("iframe");
                    adFrame.setAttribute("sandbox",
                        "allow-scripts allow-popups allow-popups-to-escape-sandbox");
                    adFrame.setAttribute("title", "Advertisement");
                    adFrame.setAttribute("loading", "lazy");
                    adFrame.setAttribute("scrolling", "no");
                    adFrame.style.border = "0";

                    var atOptions = {
                        'key': '15fbacc595e9f15699645f814d9477a3',
                        'format': 'iframe',
                        'height': 600,
                        'width': 160,
                        'params': {}
                    };

                    adFrame.srcdoc =
                        '<scr' + 'ipt>window.atOptions = ' + JSON.stringify(atOptions) + '</scr' + 'ipt>' +
                        '<scr' + 'ipt src="https://www.highperformanceformat.com/15fbacc595e9f15699645f814d9477a3/invoke.js"></scr' + 'ipt>';

                    wrap.appendChild(adFrame);
                })();
            </script>
        </aside>
    </main>

    <script src="./scripts/game.js"></script>
