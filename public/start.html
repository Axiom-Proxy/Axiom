<!DOCTYPE html>
<html lang="en">

<head>
    <script src="./scripts/font-scramble.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axiom</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./fonts/fonts.css">
    <script src="./scripts/theme.js"></script>
    <link href="./styles/loader.css" rel="stylesheet">
    <link href="./styles/start.css" rel="stylesheet">
    <link href="./styles/search.css" rel="stylesheet">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EP8214CHBW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-EP8214CHBW');
    </script>
</head>

<body>

    <div id="axiom-loader" class="ao-loader">
        <div class="ao-loader-logo">Axiom</div>
        <div class="ao-loader-spinner"></div>
    </div>

    <main class="main">
        <h1 class="logo">Axiom</h1>
        <br>
        <div class="search-wrapper rainbow-input">
            <input placeholder="Search or enter URL" class="search-bar" type="text" id="search-input" autocomplete="off">
            <ul class="suggestions" id="suggestions"></ul>
        </div>

        <div class="start-shortcuts">
            <button type="button" class="start-shortcut" onclick="goTo('chat')" title="Chat">
                <span class="material-symbols-outlined">chat</span>
                <span class="start-shortcut-label">Chat</span>
            </button>
            <button type="button" class="start-shortcut" onclick="goTo('games')" title="Games">
                <span class="material-symbols-outlined">sports_esports</span>
                <span class="start-shortcut-label">Games</span>
            </button>
            <button type="button" class="start-shortcut" onclick="goTo('apps')" title="Apps">
                <span class="material-symbols-outlined">apps</span>
                <span class="start-shortcut-label">Apps</span>
            </button>
        </div>
    </main>

    <script src="./scripts/loader.js"></script>
    <script src="./scripts/search.js"></script>
    <script>
        function goTo(page) {
            if (window.parent !== window && typeof parent.navigate === 'function') {
                parent.navigate(page);
            } else {
                location.href = './' + page + '.html';
            }
        }
    </script>
</body>

</html>
