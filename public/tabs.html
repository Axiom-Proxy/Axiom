<!DOCTYPE html>
<html lang="en">

<head>
    <script src="./scripts/font-scramble.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./fonts/fonts.css">
    <script src="./scripts/theme.js"></script>
    <link href="./styles/loader.css" rel="stylesheet">
    <link href="./styles/tabs.css" rel="stylesheet">
    <style>
        /* tabs.css sets #address-bar to the scrambled 'Roboto' with an ID rule,
           which beats the plain 'input' rule in fonts/fonts.css. Since
           font-scramble.js skips <input> text, the typed URL would render
           garbled — put the address bar back on the unscrambled font.
           Scoped here so it only affects the tabs page. */
        #address-bar {
            font-family: 'Roboto Plain', 'Roboto', sans-serif;
        }
    </style>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EP8214CHBW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-EP8214CHBW');
    </script>
</head>

<body>

    <div id="axiom-loader" class="ao-loader">
        <div class="ao-loader-logo">Axiom</div>
        <div class="ao-loader-spinner"></div>
    </div>

    <div id="browser">
        <div id="tab-bar">
            <div id="tab-list"></div>
            <button id="new-tab-btn">
                <span class="material-symbols-outlined">add</span>
            </button>
        </div>

        <div id="nav-bar">
            <button class="nav-btn" id="btn-back" title="Back">
                <span class="material-symbols-outlined">arrow_back</span>
            </button>
            <button class="nav-btn" id="btn-forward" title="Forward">
                <span class="material-symbols-outlined">arrow_forward</span>
            </button>
            <button class="nav-btn" id="btn-refresh" title="Refresh">
                <span class="material-symbols-outlined">refresh</span>
            </button>
            <div id="address-wrap">
                <span class="material-symbols-outlined" id="addr-icon">lock</span>
                <input id="address-bar" type="text" placeholder="Search or enter address" autocomplete="off" spellcheck="false">
                <!-- Inside the pill, at the end the text never reaches: what
                     this page is being served through. -->
                <span class="addr-chip" id="addr-chip" hidden></span>
            </div>

            <!-- The right of the bar was empty space the window had no use
                 for. It holds the things a browser is asked for most. -->
            <div id="nav-right">
                <button class="nav-btn" id="btn-star" title="Bookmark this page">
                    <span class="material-symbols-outlined">star</span>
                </button>
                <button class="nav-btn" id="btn-bookmarks" title="Bookmarks">
                    <span class="material-symbols-outlined">bookmarks</span>
                </button>
                <button class="nav-btn" id="btn-copy" title="Copy link">
                    <span class="material-symbols-outlined">link</span>
                </button>
                <button class="nav-btn" id="btn-home" title="Home">
                    <span class="material-symbols-outlined">home</span>
                </button>
            </div>
        </div>

        <div class="bm-panel" id="bm-panel" hidden>
            <div class="bm-empty" id="bm-empty">Nothing saved yet — the star keeps a page here.</div>
            <div class="bm-list" id="bm-list"></div>
        </div>
    </div>

    <div id="content-area"></div>
    <script src="./scripts/loader.js"></script>
    <script src="./scripts/tab-drag.js"></script>
    <script src="./scripts/tabs.js"></script>
</body>

</html>
