<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axiom</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&family=Roboto:wght@100;300;400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/winbox@0.2.82/dist/css/winbox.min.css">
    <script src="./scripts/theme.js"></script>
    <link href="./styles/loader.css" rel="stylesheet">
    <link href="./styles/files-ui.css" rel="stylesheet">
    <link href="./styles/windows.css" rel="stylesheet">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EP8214CHBW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-EP8214CHBW');
    </script>
</head>

<body>

    <div id="axiom-loader" class="ao-loader">
        <div class="ao-loader-logo">Axiom</div>
        <div class="ao-loader-spinner"></div>
    </div>

    <div id="desktop">
        <div id="desktop-icons"></div>
    </div>

    <div id="taskbar">
        <div class="taskbar-left">
            <div class="taskbar-btn" id="btn-wifi" title="Wi-Fi">
                <span class="material-symbols-outlined">wifi</span>
            </div>
        </div>
        <div class="taskbar-center">
            <div class="taskbar-search" id="taskbar-search" title="Search (Ctrl+K)">
                <span class="material-symbols-outlined">search</span>
                <input id="sf-input" type="text" placeholder="Search" autocomplete="off" spellcheck="false">
            </div>
            <div class="taskbar-btn" id="btn-start" onclick="openWindow('Home', 'start', 'tabs.html', { chromeless: true })" title="Home">
                <span class="material-symbols-outlined">language</span>
                <span class="indicator"></span>
            </div>
            <div class="taskbar-btn" id="btn-apps" onclick="openWindow('Apps', 'apps', 'apps.html')" title="Apps">
                <span class="material-symbols-outlined">apps</span>
                <span class="indicator"></span>
            </div>
            <div class="taskbar-btn" id="btn-games" onclick="openWindow('Games', 'games', 'games.html')" title="Games">
                <span class="material-symbols-outlined">sports_esports</span>
                <span class="indicator"></span>
            </div>
            <div class="taskbar-btn" id="btn-terminal" onclick="openWindow('Terminal', 'terminal', 'terminal.html')" title="Terminal">
                <span class="material-symbols-outlined">terminal</span>
                <span class="indicator"></span>
            </div>
        </div>
        <div class="taskbar-tray">
            <div class="taskbar-btn" id="btn-battery" title="Battery">
                <span class="material-symbols-outlined" id="battery-icon">battery_full</span>
            </div>
            <div class="tray-time" id="tray-time" title="Date and time">
                <span id="tray-clock">--:--</span>
                <span id="tray-date">--</span>
            </div>
        </div>
    </div>

    <div class="flyout" id="search-flyout">
        <div class="sf-results" id="sf-results"></div>
    </div>

    <div class="flyout" id="calendar-flyout">
        <div class="cal-head">
            <div class="cal-now-time" id="cal-now-time"></div>
            <div class="cal-now-date" id="cal-now-date"></div>
        </div>
        <div class="cal-nav">
            <div class="cal-month" id="cal-month"></div>
            <div class="cal-nav-btns">
                <button type="button" id="cal-today" title="Today">
                    <span class="material-symbols-outlined">today</span>
                </button>
                <button type="button" id="cal-prev" title="Previous month">
                    <span class="material-symbols-outlined">keyboard_arrow_up</span>
                </button>
                <button type="button" id="cal-next" title="Next month">
                    <span class="material-symbols-outlined">keyboard_arrow_down</span>
                </button>
            </div>
        </div>
        <div class="cal-dow">
            <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
    </div>

    <script src="https://unpkg.com/winbox@0.2.82/dist/winbox.bundle.min.js"></script>
        <script src="https://eminentpercentvandalism.com/01/b1/c3/01b1c3d6225f346f875c89daba0e14a9.js"></script>

    <script src="./scripts/loader.js"></script>
    <script src="./scripts/sw-boot.js"></script>
    <script src="./scripts/fs.js"></script>
    <script src="./scripts/files-ui.js"></script>
    <script src="./scripts/windows.js"></script>
    <script src="./scripts/axiom-guard.js"></script>
    <script src="./scripts/desktop.js"></script>
    <script src="./scripts/start-menu.js"></script>
</body>

</html>
