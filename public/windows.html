<!DOCTYPE html>
<html lang="en">

<head>
    <script src="./scripts/font-scramble.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axiom</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./fonts/fonts.css">
    <link rel="stylesheet" href="https://unpkg.com/winbox@0.2.82/dist/css/winbox.min.css">
    <script src="./scripts/theme.js"></script>
    <!-- Loaded here, not at the end: it writes the custom properties the
         stylesheet sizes the dock and icons from, and doing that after first
         paint is a visible jump. -->
    <script src="./scripts/desktop-prefs.js"></script>
    <link href="./styles/loader.css" rel="stylesheet">
    <link href="./styles/files-ui.css" rel="stylesheet">
    <link href="./styles/windows.css" rel="stylesheet">
    <!-- Last: the finish layer overrides the shell's surfaces, so it has to
         win on source order rather than on specificity. -->
    <link href="./styles/desktop-fx.css" rel="stylesheet">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EP8214CHBW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-EP8214CHBW');
    </script>
</head>

<body>

    <div id="axiom-loader" class="ao-loader">
        <div class="ao-loader-logo">Axiom</div>
        <div class="ao-loader-spinner"></div>
    </div>

    <!-- Under everything: the still picture, the two video buffers that
         crossfade between live wallpapers, and the scrim the dim/vignette
         settings paint on top of whichever is showing. -->
    <div id="wallpaper-layer">
        <div id="wp-still"></div>
        <video class="wp-video" muted loop playsinline autoplay preload="auto" disablepictureinpicture></video>
        <video class="wp-video" muted loop playsinline autoplay preload="auto" disablepictureinpicture></video>
        <!-- Above the picture, under the scrim: the accent-tinted bloom, so
             the dim and the vignette still land on top of it. -->
        <div id="wp-bloom"></div>
        <div id="wp-scrim"></div>
    </div>

    <div id="menubar">
        <div class="mb-left">
            <div class="mb-item mb-logo" data-menu="system" title="Axiom">
                <!-- Axiom's mark: nested triangles, flat white. -->
                <svg class="mb-mark" viewBox="0 0 24 22" aria-hidden="true">
                    <path d="M12 1.8 22.6 20.2H1.4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                    <path d="M12 8 17.4 17.6H6.6Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                    <path d="M12 12.6 14.1 16.2H9.9Z" fill="currentColor"/>
                </svg>
            </div>
            <div class="mb-item mb-app" data-menu="axiom">Axiom</div>
            <div class="mb-item" data-menu="file">File</div>
            <div class="mb-item" data-menu="view">View</div>
            <div class="mb-item" data-menu="go">Go</div>
            <div class="mb-item" data-menu="window">Window</div>
            <div class="mb-item" data-menu="help">Help</div>
        </div>
        <div class="mb-right">
            <div class="mb-status mb-item mb-wallpaper" id="btn-wallpaper" data-menu="wallpaper" title="Live wallpaper">
                <span class="material-symbols-outlined mb-wp-icon">motion_photos_on</span>
                <span class="mb-wp-name" id="mb-wp-name"></span>
            </div>
            <div class="mb-status mb-item" id="btn-wifi" data-menu="wifi" title="Wi-Fi">
                <span class="material-symbols-outlined">wifi</span>
            </div>
            <div class="mb-status" id="btn-battery" title="Battery">
                <span class="material-symbols-outlined" id="battery-icon">battery_full</span>
            </div>
            <div class="mb-status" id="btn-search" title="Spotlight Search (Ctrl+K)">
                <span class="material-symbols-outlined">search</span>
            </div>
            <div class="mb-status tray-time" id="tray-time" title="Date and time">
                <span id="tray-date">--</span>
                <span id="tray-clock">--:--</span>
            </div>
        </div>
    </div>

    <div id="desktop">
        <div id="desktop-clock" aria-hidden="true">
            <div class="dc-time">--:--</div>
            <div class="dc-date"></div>
            <div class="dc-greeting" hidden></div>
        </div>
        <div id="desktop-icons"></div>
    </div>

    <div id="taskbar">
        <!-- The pointer-tracked specular. It is its own clipped layer so the
             highlight moves with a transform instead of repainting the tray's
             gradient (and its backdrop blur) on every pointer move. -->
        <div class="dock-specular" aria-hidden="true"><span></span></div>
        <div class="dock-items">
            <div class="taskbar-btn" id="btn-start" data-label="Home" onclick="openWindow('Home', 'start', 'tabs.html', { chromeless: true })" title="Home">
                <span class="material-symbols-outlined">language</span>
                <span class="indicator"></span>
            </div>
            <div class="taskbar-btn" id="btn-apps" data-label="Apps" onclick="openWindow('Apps', 'apps', 'apps.html')" title="Apps">
                <span class="material-symbols-outlined">apps</span>
                <span class="indicator"></span>
            </div>
            <div class="taskbar-btn" id="btn-games" data-label="Games" onclick="openWindow('Games', 'games', 'games_norm.html')" title="Games">
                <span class="material-symbols-outlined">sports_esports</span>
                <span class="indicator"></span>
            </div>
            <div class="taskbar-btn" id="btn-theater" data-label="Theater" onclick="openWindow('Theater', 'theater', 'theater.html')" title="Theater">
                <span class="material-symbols-outlined">movie</span>
                <span class="indicator"></span>
            </div>
            <div class="taskbar-btn" id="btn-terminal" data-label="Terminal" onclick="openWindow('Terminal', 'terminal', 'terminal.html')" title="Terminal">
                <span class="material-symbols-outlined">terminal</span>
                <span class="indicator"></span>
            </div>
            <div class="taskbar-btn" id="btn-files" data-label="Files" onclick="openWindow('Files', 'files', 'explorer.html')" title="Files">
                <span class="material-symbols-outlined">folder</span>
                <span class="indicator"></span>
            </div>
            <div class="taskbar-btn" id="btn-settings" data-label="Settings" onclick="openWindow('Settings', 'settings', 'settings.html')" title="Settings">
                <span class="material-symbols-outlined">settings</span>
                <span class="indicator"></span>
            </div>
        </div>
    </div>

    <div class="flyout" id="search-flyout">
        <div class="taskbar-search" id="taskbar-search">
            <span class="material-symbols-outlined">search</span>
            <input id="sf-input" type="text" placeholder="Spotlight Search" autocomplete="off" spellcheck="false">
        </div>
        <div class="sf-results" id="sf-results"></div>
    </div>

    <div class="flyout" id="calendar-flyout">
        <div class="cal-head">
            <div class="cal-now-time" id="cal-now-time"></div>
            <div class="cal-now-date" id="cal-now-date"></div>
        </div>
        <div class="cal-nav">
            <div class="cal-month" id="cal-month"></div>
            <div class="cal-nav-btns">
                <button type="button" id="cal-today" title="Today">
                    <span class="material-symbols-outlined">today</span>
                </button>
                <button type="button" id="cal-prev" title="Previous month">
                    <span class="material-symbols-outlined">chevron_left</span>
                </button>
                <button type="button" id="cal-next" title="Next month">
                    <span class="material-symbols-outlined">chevron_right</span>
                </button>
            </div>
        </div>
        <div class="cal-dow">
            <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
    </div>

    <script src="https://unpkg.com/winbox@0.2.82/dist/winbox.bundle.min.js"></script>
        <script src="./scripts/ad.js"></script>
    <script src="./scripts/loader.js"></script>
    <script src="./scripts/sw-boot.js"></script>
    <script src="./scripts/fs.js"></script>
    <script src="./scripts/files-ui.js"></script>
    <script src="./scripts/windows.js"></script>
    <script src="./scripts/axiom-guard.js"></script>
    <script src="./scripts/desktop.js"></script>
    <!-- Before the menu bar: the bar's live-wallpaper control subscribes to
         AxiomWallpaper as it is built. -->
    <script src="./scripts/wallpaper.js"></script>
    <script src="./scripts/start-menu.js"></script>
    <script src="./scripts/menubar.js"></script>
    <script src="./scripts/desktop-fx.js"></script>
</body>

</html>
