<head>
    <meta name="description" content="Learn about geology in a fun way!">
    <meta name="keywords" content="School, Science, STEM">
    <meta name="author" content="AxiomEdu">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>

<style>
    @import url(https://fonts.googleapis.com/css?family=Inter:100,200,300,regular,500,600,700,800,900,100italic,200italic,300italic,italic,500italic,600italic,700italic,800italic,900italic);

    body {
        color: white;
        background-color: black;
        font-family: "Inter";
        justify-content: center;
        align-items: center;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
    }

    button {
        background-color: #3b82f6;
        border: none;
        color: white;
        padding: 15px 32px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        margin: 4px 2px;
        border-radius: 15px;
        cursor: pointer;
    }

    button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
    }

    #cover {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgb(128, 134, 139);
        z-index: 1;
    }
</style>
<div id="cover"></div>
<center>
    <h2>Welcome to Axiom!</h2>
    <h3>Next time when you visit, there will be a <span style="color: #3b82f6;">fake error page</span>.</h3>
    <h3>Press <span style="color: #3b82f6;">C</span> on that page to get to the Axiom OS.</h3>
    <h3>Alternatively, you can press <span style="color: #3b82f6;">X</span> to go directly to the Axiom OS Browser.</h3>
    <h3>For now though, you can press this button</h3>
    <button id="cloak" disabled>Continue in 10 seconds</button>
</center>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-EP8214CHBW"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-EP8214CHBW');
</script>

<script>

    let count = 10;
    let interval = setInterval(function () {
        document.getElementById("cloak").innerHTML = "Continue in " + count + " seconds";
        count--;
        if (count == 0) {
            clearInterval(interval);
            document.getElementById("cloak").disabled = false;
            document.getElementById("cloak").innerHTML = "Continue";
            document.getElementById("cloak").addEventListener("click", cloak);
        }
    }, 1000);


    function cloak() {
        tab = window.open("about:blank", target = "_blank")
        tab.document.write(`
      <html>
      <head>
      </head>
      <body>
        <iframe src="main.html" style="border:none; height: 100%; width: 100%; position: fixed; left: 0px; top: 0px;">
      </body>
      <script>
        window.addEventListener('beforeunload', function (e) {
            e.preventDefault();  
        });
      <\/script>
`)
tab.document.close()
}

if (localStorage.getItem("firstTime") != null) {
window.location.href = "ck.html"
}
else {
localStorage.setItem("firstTime", "true")
document.getElementById("cover").remove();
}

// check for mobbile
if (navigator.userAgent.match(/Android/i) ||
    navigator.userAgent.match(/webOS/i) ||
    navigator.userAgent.match(/iPhone/i) ||
    navigator.userAgent.match(/iPad/i) ||
    navigator.userAgent.match(/iPod/i) ||
    navigator.userAgent.match(/BlackBerry/i) ||
    navigator.userAgent.match(/Windows Phone/i)) {
    window.location.href = "mobile.html"
}

</script>
