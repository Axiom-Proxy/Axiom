<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <title>New Tab</title>
    <link rel="stylesheet" href="styles/start.css">
    <style>
        #bookmarkContainer {
            position: fixed;
            top: 0px;
            left: 0px;
            width: 100%;
            z-index: 1;
            border-bottom: var(--theme-border) 1px solid;
            margin: 0;
            padding: 5px;
            padding-bottom: 5px;
        }

        .bookmark {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            margin: 0;
            padding: 0;
            border: var(--theme-border) 1px solid;
            width: 120px;
            padding: 1px 5px 1px 5px;
            border-radius: 5px;
            height: 25px;
        }

        .bookmark img {
            width: 20px;
            height: 20px;
            border-radius: 5px;
        }

        .bookmark p {
            margin: 0;
            margin-left: 5px;
        }

        .remove-bookmark {
            margin: 0;
            margin-left: auto !important;
            margin-right: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div id="bookmarkContainer" style="display: none;"></div>

        <h3 class="logo">Axiom</h3>
    <div class="search-container">
        <input class="search-input" placeholder="Search or enter URL" type="text" id="search" autocomplete="off">
        <i class="material-symbols-outlined  search-icon">search</i>
        <div class="suggestions-dropdown" id="suggestions" style="display:none;"></div>
    </div>
  


    </div>

    <script src="scripts/themes.js"></script>
    
    <script>


        const searchInput = document.getElementById("search");
        const suggestionsBox = document.getElementById("suggestions");
        let activeIndex = -1;
        let debounceTimer = null;

        function navigate(input) {
            if (
                input.startsWith("http://") ||
                input.startsWith("https://") ||
                /^[\w-]+(\.[\w-]+)+$/.test(input)
            ) {
                window.location = "../render.html?url=" + btoa(input);
            } else {
                window.location = "../search/index.html?q=" + encodeURIComponent(input);
            }
        }

        function hideSuggestions() {
            suggestionsBox.style.display = "none";
            suggestionsBox.innerHTML = "";
            searchInput.classList.remove("has-suggestions");
            activeIndex = -1;
        }

        function showSuggestions(items) {
            if (!items.length) { hideSuggestions(); return; }
            suggestionsBox.innerHTML = "";
            searchInput.classList.add("has-suggestions");
            items.slice(0, 4).forEach((text, i) => {
                const div = document.createElement("div");
                div.className = "suggestion-item";
                div.textContent = text;
                div.addEventListener("mousedown", (e) => {
                    e.preventDefault();
                    searchInput.value = text;
                    hideSuggestions();
                    navigate(text);
                });
                suggestionsBox.appendChild(div);
            });
            suggestionsBox.style.display = "block";
            activeIndex = -1;
        }

        searchInput.addEventListener("input", function () {
            const query = this.value.trim();
            clearTimeout(debounceTimer);
            if (!query) { hideSuggestions(); return; }
            debounceTimer = setTimeout(async () => {
                try {
                    const res = await fetch("/search_complete/" + encodeURIComponent(query));
                    const data = await res.json();
                    showSuggestions(data[1] || []);
                } catch (e) { hideSuggestions(); }
            }, 200);
        });

        searchInput.addEventListener("keydown", function (event) {
            const items = suggestionsBox.querySelectorAll(".suggestion-item");
            if (event.key === "ArrowDown") {
                event.preventDefault();
                activeIndex = Math.min(activeIndex + 1, items.length - 1);
                items.forEach((el, i) => el.classList.toggle("active", i === activeIndex));
            } else if (event.key === "ArrowUp") {
                event.preventDefault();
                activeIndex = Math.max(activeIndex - 1, -1);
                items.forEach((el, i) => el.classList.toggle("active", i === activeIndex));
                if (activeIndex === -1) searchInput.value = searchInput.dataset.original || searchInput.value;
            } else if (event.key === "Enter") {
                if (activeIndex >= 0 && items[activeIndex]) {
                    searchInput.value = items[activeIndex].textContent;
                    hideSuggestions();
                }
                const input = searchInput.value;
                hideSuggestions();
                navigate(input);
            } else if (event.key === "Escape") {
                hideSuggestions();
            }
            if (event.key === "ArrowDown" && activeIndex >= 0) {
                searchInput.dataset.original = searchInput.value;
                searchInput.value = items[activeIndex].textContent;
            }
        });

        document.addEventListener("click", (e) => {
            if (!e.target.closest(".search-container")) hideSuggestions();
        });

        function loadBookmarks() {
            const bookmarks = JSON.parse(localStorage.getItem("bookmarks") || "[]");
            const container = document.getElementById("bookmarkContainer");
            container.innerHTML = "";

            bookmarks.forEach((bookmark, index) => {
                document.getElementById("bookmarkContainer").style.display = "flex";
                const bookmarkDiv = document.createElement("div");
                bookmarkDiv.className = "bookmark";

                const contentDiv = document.createElement("div");
                contentDiv.style.display = "flex";
                contentDiv.style.alignItems = "center";
                contentDiv.style.gap = "5px";

                const img = document.createElement("img");
                img.src = bookmark.icon || "./assets/axiom.png";
                img.alt = bookmark.title || "Bookmark";

                const title = document.createElement("p");
                title.textContent = bookmark.title || bookmark.url;

                contentDiv.appendChild(img);
                contentDiv.appendChild(title);

                const removeBtn = document.createElement("p");
                removeBtn.className = "remove-bookmark";
                removeBtn.textContent = "X";
                removeBtn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    removeBookmark(index);
                });

                bookmarkDiv.appendChild(contentDiv);
                bookmarkDiv.appendChild(removeBtn);

                bookmarkDiv.addEventListener("click", () => {
                    window.location = "../render.html?url=" + btoa(bookmark.url);
                });

                container.appendChild(bookmarkDiv);
            });
        }

        function removeBookmark(index) {
            let bookmarks = JSON.parse(localStorage.getItem("bookmarks") || "[]");
            bookmarks.splice(index, 1);
            localStorage.setItem("bookmarks", JSON.stringify(bookmarks));
            loadBookmarks();
        }

        loadBookmarks();
    </script>
