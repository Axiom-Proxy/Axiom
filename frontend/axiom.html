<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="styles/main.css">
</head>

<style>
    .full-wh {
        position: fixed;
        inset: 0;
        z-index: 0;
    }

    .landing-content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        gap: 12px;
    }

    .landing-content h2 {
        font-size: 1.8rem;
        font-weight: 600;
        margin: 0 0 4px;
        letter-spacing: 0.5px;
    }

    .landing-content p {
        margin: 0 0 16px;
        opacity: 0.7;
        font-size: 0.95rem;
    }

    #options {
        display: flex;
        gap: 12px;
        flex-direction: row;
        justify-content: center;
    }

    #options div {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        border: 1px solid var(--theme-border);
        padding: 14px 18px;
        border-radius: 12px;
        transition: background 0.2s, border-color 0.2s, transform 0.15s;
        font-size: 0.85rem;
        color: #fff;
    }

    #options div:hover {
        transform: translateY(-2px);
    }

    #options div .material-symbols-outlined {
        font-size: 28px;
    }
</style>

<body>
    <div class="landing-content">
        <h2>Axiom V5</h2>
        <p>Developed by Devi, socials managed by King</p>
        <p>Credits to Apathy Knight for being excessively based.</p>
        <br>
        <p>Someday we'll all be free</p>
    </div>


<script src="./browser/scripts/themes.js"></script>
</body>
</html>
